[mgr]
# show_hidden = true
sort_by = "mtime"
sort_reverse = true
linemode = "mtime"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

[opener]
# Override default edit opener to preserve original yazi cwd
# YAZI_START_DIR is set by the `y` alias to capture the directory where yazi was launched
edit = [
  { run = '''sh -c 'cd "${YAZI_START_DIR:-$PWD}" && nvim "$1"' -- %s''', desc = "nvim (preserve cwd)", block = true, for = "unix" },
]
# linux entry first - beats the unix/mpv match on the VPS, never matches macOS. block = true so the relay copy shows progress.
video = [
  { run = 'to-desktop media %s1', block = true, desc = "VLC on the workstation", for = "linux" },
  { run = 'open -na "VLC" %s 2>/dev/null', desc = "VLC (new instance)", for = "macos" },
]
# Mirrors the default `play` opener, linux entry prepended.
audio = [
  { run = 'to-desktop media %s1', block = true, desc = "Play on the workstation", for = "linux" },
  { run = 'mpv --force-window %s', orphan = true, for = "unix" },
  { run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
# Mirrors the default `open` opener, linux entry prepended.
image = [
  { run = 'to-desktop media %s1', block = true, desc = "Open on the workstation", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
]

[open]
# `reveal` kept second on audio/image so the open-with menu matches the defaults these rules shadow.
prepend_rules = [
  { mime = "video/*", use = "video" },
  { mime = "audio/*", use = [ "audio", "reveal" ] },
  { mime = "image/*", use = [ "image", "reveal" ] },
]

[tasks]
# Viewport preload = one ~1s magick/ffmpeg per visible file; media dirs still churn at quit.
suppress_preload = true
