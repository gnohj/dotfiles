# ██╗  ██╗██╗████████╗████████╗██╗   ██╗
# ██║ ██╔╝██║╚══██╔══╝╚══██╔══╝╚██╗ ██╔╝
# █████╔╝ ██║   ██║      ██║    ╚████╔╝
# ██╔═██╗ ██║   ██║      ██║     ╚██╔╝
# ██║  ██╗██║   ██║      ██║      ██║
# ╚═╝  ╚═╝╚═╝   ╚═╝      ╚═╝      ╚═╝
#
# Kitty is a fast, feature-rich, GPU based terminal emulator
# https://sw.kovidgoyal.net/kitty/conf

# This will be used to set the `TERM` environment variable.
term xterm-kitty

# Include theme file (generated dynamically by colorscheme-set.sh)
include kitty-theme.conf

# Fonts
# family+style here vs face names in Ghostty - same faces; all four pinned so the two can't diverge.
font_family      family="JetBrainsMono Nerd Font Mono" style="Regular"
bold_font        family="JetBrainsMono Nerd Font Mono" style="Bold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size 15

# Ghostty's adjust-* are deltas, kitty's % a fraction of the metric - converted, so they differ.
modify_font cell_width 95%           # ghostty adjust-cell-width = -5%
modify_font cell_height 110%         # ghostty adjust-cell-height = 10%
modify_font underline_thickness 140% # ghostty adjust-underline-thickness = 40%

# Matches Ghostty: thicken off, "platform" is its macOS-gamma blend ("legacy" read duller).
macos_thicken_font 0
text_composition_strategy platform
disable_ligatures never

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Cursor trail animation (similar to ghostty cursor shaders)
cursor_trail 1
cursor_trail_decay 0.1 0.5

# Shell integration
shell_integration enabled
# Disable cursor shell integration (matches ghostty no-cursor)
shell_integration no-cursor
# Disable sudo integration (matches ghostty no-sudo)
shell_integration no-sudo

# Shell command - ensure zsh runs as login shell to source Nix profile
# shell /bin/zsh --login

# Window
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 1200
initial_window_height 800

# Window padding - 4 values in kitty order (top right bottom left). Matches
# ghostty (window-padding-y=8,8 top/bottom + window-padding-x=20,20 left/right).
# NOTE: kitty has NO `window_padding_height` key (it silently ignores it); the
# top padding is controlled here, so this MUST use the 4-value form.
window_padding_width 8 20 8 20
placement_strategy center

# macOS specific
# Matches Ghostty's window-colorspace=display-p3; the srgb default read duller (new windows only).
macos_colorspace displayp3
macos_titlebar_color background
macos_show_window_title_in none
macos_option_as_alt right
macos_quit_when_last_window_closed yes
macos_window_resizable yes
macos_custom_beam_cursor yes

# Mouse
mouse_hide_wait -1

# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# cmd+v / hyper+v -> smart paste: image sends Ctrl+V (0x16) for Claude Code, else normal text paste (static \x16 broke text paste - it's quoted-insert in shell, visual-block in vim).
map cmd+v kitten paste_smart.py
map hyper+v kitten paste_smart.py

# Keybindings - Ghostty specific commands
# Reload config
map cmd+r load_config_file

# Clear screen
map cmd+k combine : clear_terminal scrollback active : send_text normal \x0c

# Inspector (closest equivalent is show_kitty_env_vars)
map cmd+i show_kitty_env_vars

# hijack key events before encoding (ghosty cant encode modern keys, so it swallows/clobbers)
map ctrl+` send_text all \x01p
map ctrl+tab send_text all \x01n
map ctrl+shift+tab send_text all \x01p
map ctrl+space send_text all \x01\x20
map ctrl+enter send_text all \x01L
# ctrl+; and ctrl+' feed herdr's prefix+, / prefix+' agent-queue binds - not tmux-dash leftovers
map ctrl+; send_text all \x01\x2c
map ctrl+' send_text all \x01\x27
map ctrl+/ send_text all \x01\x2f
map ctrl+1 send_text all \x01\x31
map ctrl+2 send_text all \x01\x32
map ctrl+3 send_text all \x01\x33
map ctrl+4 send_text all \x01\x34
map ctrl+5 send_text all \x01\x35
map ctrl+6 send_text all \x01\x36
map ctrl+7 send_text all \x01\x37
map ctrl+8 send_text all \x01\x38
map ctrl+9 send_text all \x01\x39
map ctrl+0 send_text all \x01\x30

# Misc
confirm_os_window_close 0
enable_audio_bell no

# URL handling
url_style curly
detect_urls yes
show_hyperlink_targets yes

# Click-to-open links: cmd on macOS, hyper on Linux (kitty default stays ctrl+shift+left)
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map hyper+left release grabbed,ungrabbed mouse_handle_click link

# Tab bar (hidden by default like ghostty)
tab_bar_style hidden

# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 3

dynamic_background_opacity yes
background_opacity 0.875
# background_opacity 1.0
