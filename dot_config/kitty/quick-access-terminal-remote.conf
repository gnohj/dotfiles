# kitty quake — REMOTE variant: the launcher running on the dev-context target, toggled by skhd cmd+rctrl+t.
edge top
lines 370px

hide_on_focus_loss yes

# Esc resets the launcher to root then hides; a burst because fzf-vim.sh is modal and one Esc only leaves INSERT.
kitty_override map escape combine : send_text all \x1b\x1b\x1b\x1b\x1b\x1b : hide_macos_app

# The launcher runs on the dev box, so its only route home is kitty's tty escape channel.
# Scoped by rc-auth.py to hide-panel + open-web-url, so the box cannot run anything else here.
kitty_conf kitty.conf
kitty_conf quake-rc.conf

# Dimmer than the local quake — the at-a-glance cue that these actions land on the box.
background_opacity 0.90
