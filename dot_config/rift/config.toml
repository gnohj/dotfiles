[keys]

# Entered from skhd (lalt+shift+`); every key drops back to default.
[binding_modes.service]
"Escape" = [{ binding_mode = "default" }, "reload_config", { exec = ["/bin/bash", "-c", "/opt/homebrew/bin/sketchybar --trigger hide_message; /opt/homebrew/bin/sketchybar --reload"] }]
"B" = [{ binding_mode = "default" }, { exec = ["/bin/bash", "-c", "/opt/homebrew/bin/sketchybar --bar height=0; /opt/homebrew/bin/sketchybar --trigger hide_message"] }]
"Shift + B" = [{ binding_mode = "default" }, { exec = ["/bin/bash", "-c", "/opt/homebrew/bin/sketchybar --bar height=36; /opt/homebrew/bin/sketchybar --trigger hide_message"] }]
"F" = [{ binding_mode = "default" }, "toggle_window_floating"]
