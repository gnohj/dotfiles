# Rex-only sesh entries (never read by sesh or tmux): rex_host is the host each opens on, rex_label its session name there.

[[session]]
name = "hermes-devbox"
path = "~/.local/share/hermes/workspace"
alias = "h"
startup_command = "hermes-container"
rex_host = "Dev Box"
rex_label = "hermes"

[[session]]
name = "sm-inferno"
path = "~/.local/share/firstmate-sm-inferno"
alias = "smi"
rex_host = "Dev Box"

[[session]]
name = "sm-web"
path = "~/.local/share/firstmate-sm-web"
alias = "smw"
rex_host = "Dev Box"

[[session]]
name = "home"
path = "~"
alias = "x"

[[session]]
name = "devbox-home"
path = "~"
alias = "z"
rex_host = "Dev Box"
rex_label = "home"
