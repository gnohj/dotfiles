text = "#b8c9d3"
muted = "#9fb7a4"
border = "#40474b"
selectedHunk = "#536571"
lineNumberFg = "#9fb7a4"
addedBg = "#132a19"
addedContentBg = "#1f4a2a"
addedSignColor = "#b7ce97"
removedBg = "#2a1319"
removedContentBg = "#4a1f2a"
removedSignColor = "#da858e"
movedAddedBg = "#132a19"
movedRemovedBg = "#2a1319"
badgeAdded = "#b7ce97"
badgeRemoved = "#da858e"
badgeNeutral = "#536571"
fileNew = "#b7ce97"
fileModified = "#dab183"
fileDeleted = "#da858e"
fileRenamed = "#a3b8c6"
fileUntracked = "#9fb7a4"
