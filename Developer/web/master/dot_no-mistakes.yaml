# Per-repo no-mistakes overrides for iheartradio/web.
#
# Contract: no-mistakes owns the LIFECYCLE - which steps run and in what order.
# The iheart:* skills stay authoritative for CONTENT ONLY, carried here as
# per-step instructions. None of those skills' own sequencing is reproduced
# below; step selection is not expressible in this file at all (it is the
# per-run `--skip` flag), so nothing here turns a step on or off.
#
# Trusted-only: this file is honored from the default-branch (master) copy, so
# a pushed branch cannot weaken it.
#
# Deliberately NOT set:
#   disable_project_settings - web's CLAUDE.md is the primary content channel
#     (key ordering, comment style, TypeScript rules, testing conventions,
#     changeset policy, apps-legacy freeze) and the pipeline agents must read
#     it. firstmate disables project settings because its AGENTS.md installs a
#     fleet-captain identity; web's CLAUDE.md carries conventions, not identity.
#   allow_repo_commands - leaving it off means `commands` and `agent` are honored
#     only from this trusted master copy, never from a pushed branch.
#   no_ci - web has CI. Setting it would make the pipeline treat a zero-check
#     read as green.
#   commit.fix_message - web's commit convention is `[IHRWEB-XXXX] Description`,
#     but the template exposes only {{.Step}} and {{.Summary}}, with no ticket
#     variable, so the convention cannot be reproduced. The default subject is
#     left in place; web squash-merges, so branch commit subjects are collapsed
#     into the PR title at integration time anyway.
#   ci.rerun_transient - stays at the global default of 0. A cancelled check on
#     this repo is frequently a deliberate concurrency-group cancellation from
#     auto-update-prs.yml or a maintainer, and each rerun is billed to the repo.

auto_fix:
  # Keep review findings parked for a human decision rather than self-fixed.
  # This is already the shipped default; it is stated here because web review
  # findings routinely touch product behavior and land as `ask-user`.
  review: 0

commands:
  # Lint only. The canonical lint definition CI enforces, and nothing more.
  # Pinning it here matters because no-mistakes' default handling does not know
  # this repo's lint entry point (root `pnpm lint` is only `eslint scripts`).
  #
  # `--concurrency=1` is load-bearing, not tuning: the apps/{listen,account}
  # lint scripts run `react-router typegen` inline, and parallel invocations
  # race on `.react-router/types` with
  # `ENOTEMPTY: directory not empty, rmdir .../+types`.
  #
  # `CI=true` (never CI=1) is a hashed turbo input on the sharded tasks, so it
  # is the only value that can reuse an artifact CI already built.
  #
  # typecheck and check-i18n are deliberately NOT here. Including them made this
  # step roughly `pnpm checks` minus tests, which is the second-CI-run shape the
  # local steps are meant to avoid. The ci step's auto-fix rounds absorb
  # typecheck and i18n failures instead. Accepted consequence: en.json
  # developer_comment drift now surfaces in CI rather than locally, since
  # check-i18n sits outside both the turbo graph and the husky pre-push hook.
  lint: "CI=true pnpm exec turbo run lint --affected --output-logs=new-only --concurrency=1"

  # commands.test is deliberately UNSET.
  #
  # .github/workflows/ci.yml owns broad regression: the sharded
  # typecheck/lint/test matrix plus the coverage-merge job that recombines the
  # per-package coverage blobs. The local Test step is intent-targeted
  # validation of whether the change meets its brief. Setting
  # `CI=true turbo run test --affected` here would duplicate CI, add minutes to
  # every run, and defeat the targeted Test contract.

document:
  instructions: |
    Read CLAUDE.md at the repo root first; it is authoritative for this
    repository's conventions and this block only adds to it.

    Placement:
    - Repo-wide conventions belong in CLAUDE.md, under an existing section.
    - Team expectations belong in apps/docs/src/expectations.mdx.
    - Test-authoring guidance belongs in docs/writing-fast-tests.md.
    - Package-specific detail belongs in that package's README.md.
    - Never edit any CHANGELOG.md; they are generated by changesets.
    - Never edit files marked auto-generated, anything under a generated/ or
      __generated__/ directory, or packages/translations/locales/*.json. If
      locale metadata is stale, run `pnpm i18n` and commit its exact output.
    - A .changeset/*.md file is a release note, not documentation. Do not treat
      writing one as satisfying documentation coverage.

    Code documentation:
    - Document new exported functions, classes, types, interfaces and constants
      in files this change adds, and exports whose observable behavior this
      change altered. Leave unchanged exports alone.
    - "Meaningfully changed" means a signature change, a return type narrowed
      or widened in a way that affects callers, a new side effect, a new thrown
      condition, a new edge case, or a semantic change. It does not mean a
      rename, an internal refactor, a formatting change, or an import reorder.
    - Use /** */ block comments. Never // line comments and never a single-line
      /** */ form.
    - Lead with why the export exists or what non-obvious constraint it carries.
      Do not restate the signature. One to three sentences is enough.
    - Skip test files, *.stories.tsx, *.mdx, changesets, lockfiles, markdown,
      YAML, JSON and CSS.

    Prose style:
    - Never use an em dash. Use a plain hyphen.
    - In long markdown files, put each full sentence on its own physical line.

review:
  path_instructions:
    - path: .changeset
      instructions: |
        A changeset is required whenever the change touches source of a
        publishable workspace package that is not on `.changeset/config.json`'s
        `ignore` list. `private: true` is NOT a proxy for "no changeset needed":
        @iheartradio/web.account, .listen and .fastly are private and still
        require entries.

        Format:
        - Use only `patch` or `minor`. `major` is forbidden by this repository
          and `scripts/check-changesets.mts` rejects it for anything under apps/.
        - One file per ticket. If the branch already introduced a changeset for
          this ticket, merge the new packages into its frontmatter (taking the
          higher bump on a collision) rather than adding a second file.
        - Frontmatter keys are the PUBLISHED package names, single-quoted, one
          per line, sorted alphabetically.
        - The body is one sentence describing the user-visible effect, prefixed
          with a linked ticket reference:
          `[IHRWEB-XXXX](https://ihm-it.atlassian.net/browse/IHRWEB-XXXX): …`.
          Omit the prefix only for genuinely unticketed work.
        - Filenames are the three-word human-id slugs `@changesets/cli`
          generates (for example `bright-foxes-jump.md`). Do not hand-author a
          descriptive filename.
        - Never use an em dash in the body.

        A green `pnpm changeset status` means "the changesets present are
        well-formed". It does NOT mean every touched package is covered; it
        exits 0 with a touched, non-ignored package entirely missing.

    - path: packages
      instructions: |
        Every package here publishes as `@iheartradio/web.<dir>` unless it is on
        `.changeset/config.json`'s ignore list, so a source change needs a
        changeset entry keyed on the published name read from its package.json.

        For .ts and .tsx files in this tree:
        - Never use `any`. Use an explicit type, a generic, or `unknown` with a
          type guard.
        - Keys in object literals, type literals, interfaces, Pick/Omit utility
          types, zod schemas and union members are alphabetically ordered. When
          adding a key, resort the whole block.
        - Every if / else / for / while body takes braces, including early
          returns in guard clauses.
        - When a function body is an exhaustive switch, the return that
          satisfies consistent-return goes in a `default` arm INSIDE the switch,
          never as a trailing statement after it. A trailing return there fails
          `tsc` with TS7027 under `allowUnreachableCode: false`, and neither
          `build` nor `pnpm checks` catches it. If the extra `default` branch
          would push the package under its coverage floor, assign into a local
          in each arm and return once after the switch instead.
        - An unused local, an unused type alias, or an unused shorthand
          destructure is a compile error; a leading underscore does NOT exempt
          it (that works only for parameters and type parameters). Delete the
          dead symbol rather than renaming it.
        - Use `/** */` block comments only.
        - Import workspace packages absolutely as `@iheartradio/web.*`, never by
          relative cross-package path, and never through a barrel or namespace
          re-export.
        - Read configuration through `@iheartradio/web.config`. Never hardcode
          environment or config values.

        For test files in this tree (*.test.ts(x), *.spec.ts(x), __test__/,
        __tests__/, __spec__/, __specs__/):
        - Read docs/writing-fast-tests.md. No wall-clock sleeps, no focused
          tests, no MSW bypass.
        - `clearMocks`, `restoreMocks`, `unstubEnvs` and `unstubGlobals` are all
          on. Pass the implementation at creation (`vi.fn(() => value)`); never
          chain `.mockReturnValue` / `.mockResolvedValue` / `.mockImplementation`
          onto a bare `vi.fn()`.
        - Register per-test state in `beforeEach`. Anything set at module scope,
          describe scope, or in `beforeAll` is wiped before the first test runs
          or evaporates after it.
        - A `vi.mock` factory whose inner `vi.fn()` members tests hold
          references to must build the client object once and return that same
          instance from the accessor.
        - Never assign over a global or a prototype method. Use
          `vi.stubGlobal(...)` for globals and `vi.spyOn(target, 'method')` for
          methods; a plain assignment is invisible to every auto-reset flag.
        - A file needing a non-default environment declares it with an
          `@vitest-environment <env>` docblock. Never reintroduce glob-to-env
          routing via `projects`.
        - Coverage thresholds are 90% on branches, functions, lines and
          statements, instrumented only when CI is set. A package may raise its
          floor, never lower it.

    - path: apps
      instructions: |
        apps/listen, apps/account and apps/fastly are versioned workspace
        packages and are NOT on `.changeset/config.json`'s ignore list, so a
        source change here requires a changeset entry under
        `@iheartradio/web.listen`, `@iheartradio/web.account` or
        `@iheartradio/web.fastly`. A `git diff -- 'packages/*/**'` style scan
        will miss this tree entirely.

        All the TypeScript, comment, import, config and test rules stated for
        the `packages` tree apply here verbatim.

        Additionally:
        - Never call a backend directly from a component. Go through
          `@iheartradio/web.api`.
        - Validate at system boundaries with zod.
        - Function components with hooks only. No class components.
        - Adding any file under apps/** can shift `developer_comment`
          provenance in packages/translations/locales/en.json even when the file
          contains zero `t()` calls. If it does, run `pnpm i18n` and commit the
          regenerated file; confirm the diff touches only `developer_comment`
          lines and no translated string values.

    - path: tooling
      instructions: |
        These are versioned workspace members and none of them is on
        `.changeset/config.json`'s ignore list, so a change here requires a
        changeset. Their published names do NOT carry the `web.` infix:
        `tooling/eslint-config-web` publishes as
        `@iheartradio/eslint-config-web`, not `@iheartradio/web.eslint-config-web`.
        Always read the name out of the package's own package.json; never
        synthesise it from the directory name.

        Never partially override a preset's ESLint rule options. ESLint replaces
        a rule's options rather than merging them, so any flag left out falls
        back to the rule's own default, not the preset's. Spell out every flag,
        and add an entry to tooling/eslint-config-web/rule-options.test.mjs so
        the full resolved object is asserted.

    - path: templates
      instructions: |
        Templates are versioned workspace members. `package-template` and
        `github-package-template` are on `.changeset/config.json`'s ignore list;
        `remix-app-template` is NOT, so a change touching it requires a
        changeset. The husky pre-push hook reports
        "Validate Changesets (skipped - no publishable packages changed)" for a
        templates-only diff, so the hook passing is not evidence a changeset is
        unnecessary; `pnpm checks` still fails without one.

    - path: .github/actions
      instructions: |
        `pnpm-workspace.yaml` lists `.github/actions/*` as workspace members and
        `privatePackages.version: true` tracks them, so EVERY touched action
        package needs a changeset entry. Resolve the package root as the
        three-segment path `.github/actions/<name>` and read the published name
        from its package.json: the names do not all mirror the directory
        (`.github/actions/ci` is `@iheartradio/web.ci-action`,
        `.github/actions/oauth` is `@iheartradio/web.oauth-action`).

        These packages ship committed dist/ bundles. A source change is not
        complete until the bundle is regenerated: run `pnpm build-packages`
        first, THEN `pnpm build-actions` (that order - a stale package dist
        otherwise gets baked into the action bundle), and commit the regenerated
        dist/index.js alongside the source. Expect more bundles to change than
        were edited: an action that merely imports a modified package rebuilds
        too.

    - path: apps-legacy
      instructions: |
        This tree is deprecated and maintenance-only. Flag any change here that
        adds new functionality rather than fixing or removing existing behavior,
        and say plainly that new work belongs in apps/ instead. Bug fixes and
        deletions are legitimate.

        `apps-legacy/www` still publishes as `@iheartradio/web.www` and is not
        on the ignore list, so a source change there requires a changeset.
        `activate`, `sdk` and `web-config` ARE on the ignore list and must not
        get one.

test:
  evidence:
    # Keep validation artifacts out of the repository. iheart:pr Step 10 rule e
    # already rules that screenshots must not be embedded in PR bodies;
    # committing them under .no-mistakes/evidence would push them to the branch
    # and render them on the PR, which is the same outcome by another route.
    store_in_repo: false
